<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Просмотр Распаковки</title>
  <style>
    /* CSS Variables */
    :root {
      /* Светлая тема */
      --bg-primary: #f8f9fa;
      --bg-card: #ffffff;
      --hover-bg: #f0f0f0;
      --active-bg: #e8e8e8;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --border-color: rgba(0,0,0,0.1);
      --shadow: 0 2px 8px rgba(0,0,0,0.1);
      --shadow-hover: 0 4px 12px rgba(0,0,0,0.15);
      --primary-color: #4285f4;
      --primary-hover: #3367d6;
      --primary-active: #2a56c6;
    }

    /* Тёмная тема */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1a1a1a;
        --bg-card: #2a2a2a;
        --hover-bg: #333333;
        --active-bg: #3a3a3a;
        --text-primary: #ffffff;
        --text-secondary: #aaaaaa;
        --border-color: rgba(255,255,255,0.1);
        --shadow: 0 2px 8px rgba(0,0,0,0.3);
        --shadow-hover: 0 4px 12px rgba(0,0,0,0.4);
        --primary-color: #4285f4;
        --primary-hover: #5a9cff;
        --primary-active: #6ba8ff;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 20px;
    }

    #app {
      max-width: 100%;
      margin: 0 auto;
    }

    /* === ЗАГОЛОВОК === */
    .header {
      margin-bottom: 24px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .stats {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .header-controls {
      display: flex;
      gap: 12px;
    }

    /* === КНОПКИ === */
    .btn-primary,
    .btn-secondary {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    .btn-primary:active {
      background: var(--primary-active);
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: var(--hover-bg);
    }

    .btn-secondary:active {
      background: var(--active-bg);
    }

    /* === ИНДИКАТОР ЗАГРУЗКИ === */
    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border-color);
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* === КОНТЕЙНЕР КАРТОЧЕК === */
    .fields-container {
      margin-bottom: 20px;
    }

    /* === КАРТОЧКА ПОЛЯ === */
    .field-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .field-card:hover {
      box-shadow: var(--shadow-hover);
    }

    /* Заголовок карточки */
    .field-header {
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
      transition: background 0.2s ease;
    }

    .field-header:hover {
      background: var(--hover-bg);
    }

    .field-header:active {
      background: var(--active-bg);
    }

    /* Иконка раскрытия слева */
    .expand-icon {
      font-size: 12px;
      transition: transform 0.3s ease;
      color: var(--primary-color);
      flex-shrink: 0;
    }

    .field-card.collapsed .expand-icon {
      transform: rotate(-90deg);
    }

    /* Название поля */
    .field-title {
      flex: 1;
      font-weight: 600;
      font-size: 16px;
      color: var(--text-primary);
      line-height: 1.4;
    }

    /* Кнопка-индикатор справа */
    .toggle-btn {
      font-size: 10px;
      color: var(--text-secondary);
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    .field-card.collapsed .toggle-btn {
      transform: rotate(-90deg);
    }

    /* Контент карточки */
    .field-content {
      max-height: 2000px;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
      opacity: 1;
    }

    .field-content.collapsed {
      max-height: 0;
      opacity: 0;
    }

    /* Разделитель */
    .field-divider {
      height: 1px;
      background: var(--border-color);
      margin: 0 16px 12px 16px;
    }

    .field-content.collapsed .field-divider {
      display: none;
    }

    /* Значение поля */
    .field-value {
        white-space: pre-wrap;
      padding: 0 16px 12px 16px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* === ФУТЕР === */
    .footer {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    /* === МОДАЛЬНОЕ ОКНО === */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--bg-card);
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .modal-body {
      padding: 20px;
    }

    .doc-name {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-actions .btn-primary {
      width: 100%;
      justify-content: center;
    }

    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: center;
    }

    .modal-footer .btn-secondary {
      width: 100%;
    }
    
  .files-list {
    list-style: none;
    padding: 0;
  }

  .file-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-color);
  }

  .file-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
  }

  .file-name {
    flex: 1;
    cursor: pointer;
    color: var(--text-primary);
  }

  .file-link {
    padding: 4px 8px;
    background-color: var(--primary-color);
    color: white;
    text-decoration: none;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }

  .file-link:hover {
    background-color: var(--primary-hover);
  }

    /* === АДАПТИВНОСТЬ === */
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      
      .header-controls {
        flex-direction: column;
      }
      
      .header-controls .btn-secondary {
        width: 100%;
      }
      
      .footer {
        flex-direction: column;
      }
      
      .footer button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Контейнер приложения -->
  <div id="app">
    
    <!-- Заголовок -->
    <div class="header">
      <h1 class="title">📦 Просмотр данных - Распаковка + ЦА</h1>
      <div class="stats">
        <span id="expand-counter">Развёрнуто: 1 из 4</span>
      </div>
      <div class="header-controls">
        <button class="btn-secondary" onclick="openMyFilesDialog()">
          📁 Мои файлы
        </button>
        <button class="btn-secondary" onclick="expandAll()">
          ▼ Развернуть всё
        </button>
        <button class="btn-secondary" onclick="collapseAll()">
          ▲ Свернуть всё
        </button>
      </div>
    </div>

    <!-- Индикатор загрузки -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Загрузка данных...</p>
    </div>

    <!-- Контейнер карточек -->
    <div id="fields-container" class="fields-container">
      <!-- Карточки генерируются динамически через JS -->
    </div>

    <!-- Кнопки действий -->
    <div class="footer">
      <button class="btn-secondary" onclick="refreshData()">
        🔄 Обновить
      </button>
      <button class="btn-primary" onclick="exportToDoc()">
        📄 Экспорт в документ
    </div>

  </div>

  <!-- Модальное окно результата экспорта -->
  <div id="export-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>✅ Документ успешно создан!</h2>
      </div>
      <div class="modal-body">
        <p class="doc-name">📄 <span id="doc-name"></span></p>
        <div class="modal-actions">
          <button class="btn-primary" onclick="openDocument()">
            🌐 Открыть в Google Docs
          </button>
          <button class="btn-primary" onclick="downloadDocument()">
            💾 Скачать .docx на компьютер
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">
          Закрыть
        </button>
      </div>
    </div>
    
  <!-- Модальное окно "Мои файлы" -->
  <div id="myfiles-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📁 Мои файлы</h2>
      </div>
      <div class="modal-body" id="myfiles-body">
        <p>Нет распакованных документов</p>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeMyFilesModal()">Закрыть</button>
      </div>
    </div>
  </div>
  </div>

  <script>
    // Глобальные переменные
    let currentData = [];
    let exportResult = null;

    // Загрузка данных при открытии
    window.onload = function() {
      loadData();
    };

    // Загрузка данных с сервера
    function loadData() {
      showLoading(true);
      
      google.script.run
        .withSuccessHandler(onDataLoaded)
        .withFailureHandler(onError)
        .getUnpackingData();
    }

    // Обработка полученных данных
    function onDataLoaded(response) {
      showLoading(false);
      
      if (!response.success) {
        showError(response.error);
        return;
      }
      
      currentData = response.data;
      renderCards(currentData);
      updateCounter();
    }

    // Отображение ошибки
    function onError(error) {
      showLoading(false);
      showError('Ошибка загрузки данных: ' + error.message);
    }

    // Создание всех карточек
    function renderCards(data) {
      const container = document.getElementById('fields-container');
      container.innerHTML = ''; // Очистка
      
      data.forEach((field, index) => {
        const card = createFieldCard(field, index);
        container.appendChild(card);
      });
      
      // Первая карточка развёрнута по умолчанию
      if (data.length > 0) {
        expandCard(0);
      }
    }

    // Создание одной карточки
    // Создание одной карточки
    function createFieldCard(field, index) {
      const card = document.createElement('div');
      card.className = 'field-card collapsed';
      card.setAttribute('data-field-id', index);
      
      // Определяем длину текста для индикации
      const isLongText = field.value.length > 300;
      const lengthIndicator = isLongText ? '' : '';
      
      // Индикация количества элементов
      const countIndicator = field.count > 1 ? `` : '';
      
      // Объединяем оба индикатора
      const indicators = countIndicator + lengthIndicator;
      
      card.innerHTML = `
        <div class="field-header" onclick="toggleCard(${index})">
          <span class="expand-icon">▼</span>
          <span class="field-title">📌 ${field.header}${indicators}</span>
          <span class="toggle-btn">▼</span>
        </div>
        <div class="field-content collapsed">
          <div class="field-divider"></div>
          <div class="field-value">${escapeHtml(field.value)}</div>
        </div>
      `;
      
      return card;
    }

    // Экранирование HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Переключение одной карточки
    function toggleCard(fieldId) {
      const card = document.querySelector(`[data-field-id="${fieldId}"]`);
      const content = card.querySelector('.field-content');
      
      if (card.classList.contains('collapsed')) {
        expandCard(fieldId);
      } else {
        collapseCard(fieldId);
      }
      
      updateCounter();
    }

    // Развернуть карточку
    function expandCard(fieldId) {
      const card = document.querySelector(`[data-field-id="${fieldId}"]`);
      const content = card.querySelector('.field-content');
      
      card.classList.remove('collapsed');
      content.classList.remove('collapsed');
    }

    // Свернуть карточку
    function collapseCard(fieldId) {
      const card = document.querySelector(`[data-field-id="${fieldId}"]`);
      const content = card.querySelector('.field-content');
      
      card.classList.add('collapsed');
      content.classList.add('collapsed');
    }

    // Развернуть все карточки
    function expandAll() {
      const cards = document.querySelectorAll('.field-card');
      cards.forEach((card, index) => {
        setTimeout(() => {
          const fieldId = card.getAttribute('data-field-id');
          expandCard(fieldId);
        }, index * 50); // Каскадная анимация
      });
      
      setTimeout(updateCounter, cards.length * 50 + 100);
    }

    // Свернуть все карточки
    function collapseAll() {
      const cards = document.querySelectorAll('.field-card');
      cards.forEach((card, index) => {
        setTimeout(() => {
          const fieldId = card.getAttribute('data-field-id');
          collapseCard(fieldId);
        }, index * 50); // Каскадная анимация
      });
      
      setTimeout(updateCounter, cards.length * 50 + 100);
    }

    // Обновление счётчика
    function updateCounter() {
      const total = document.querySelectorAll('.field-card').length;
      const expanded = document.querySelectorAll('.field-card:not(.collapsed)').length;
      
      document.getElementById('expand-counter').textContent = 
        `Развёрнуто: ${expanded} из ${total}`;
    }

    // Перезагрузка данных
    function refreshData() {
      loadData();
    }

    // Экспорт данных в Google Docs
    function exportToDoc() {
      showLoading(true);
      
      google.script.run
        .withSuccessHandler(onExportSuccess)
        .withFailureHandler(onExportError)
        .exportUnpackingToDoc();
    }

    // Успешный экспорт
    function onExportSuccess(response) {
      showLoading(false);
      
      if (!response.success) {
        showError(response.error);
        return;
      }
      
      exportResult = response;
      showExportModal(response);
    }

    // Ошибка экспорта
    function onExportError(error) {
      showLoading(false);
      showError('Ошибка экспорта: ' + error.message);
    }

    // Показ модального окна с результатом
    function showExportModal(result) {
      document.getElementById('doc-name').textContent = result.fileName;
      document.getElementById('export-modal').style.display = 'flex';
    }

    // Закрытие модального окна
    function closeModal() {
      document.getElementById('export-modal').style.display = 'none';
    }

    // Открытие документа в Google Docs
    function openDocument() {
      if (exportResult && exportResult.docUrl) {
        window.open(exportResult.docUrl, '_blank');
      }
    }

    // Скачивание документа как .docx
    function downloadDocument() {
      if (exportResult && exportResult.downloadUrl) {
        window.open(exportResult.downloadUrl, '_blank');
      }
    }

    // Показ/скрытие индикатора загрузки
    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'flex' : 'none';
      document.getElementById('fields-container').style.display = show ? 'none' : 'block';
    }

    // Показ ошибки
    function showError(message) {
      alert('❌ ' + message);
    }

    // Модальное окно "Мои файлы"
    function openMyFilesDialog() {
      google.script.run.withSuccessHandler(displayMyFiles).getExportedDocuments();
    }

    function closeMyFilesModal() {
      document.getElementById('myfiles-modal').style.display = 'none';
    }

    function displayMyFiles(docs) {
      const body = document.getElementById('myfiles-body');
      if (!docs || docs.length === 0) {
        body.innerHTML = '<p>Нет распакованных документов</p>';
        document.getElementById('myfiles-modal').style.display = 'block';
        return;
      }

      let html = '<div class="files-list">';
      docs.forEach((doc, index) => {
        html += `<div class="file-item">`;
        html += `<input type="checkbox" id="file-${index}" class="file-checkbox" value="${doc.rowIndex}">`;
        html += `<label for="file-${index}" class="file-name">${doc.name}</label>`;
        html += `<a href="${doc.url}" target="_blank" class="file-link">Открыть</a>`;
        html += `</div>`;
      });
      html += '</div>';
      html += '<button onclick="deleteSelectedFiles()" class="btn-secondary" style="margin-top: 10px;">Удалить выбранные</button>';
      body.innerHTML = html;
      
      // Открыть модальное окно после заполнения данных
      document.getElementById('myfiles-modal').style.display = 'block';
    }

    function deleteSelectedFiles() {
      const checkboxes = document.querySelectorAll('.file-checkbox:checked');
      const indices = Array.from(checkboxes).map(cb => parseInt(cb.value));
      if (indices.length === 0) {
        alert('Выберите документы для удаления');
        return;
      }
      google.script.run.deleteExportedDocs(indices);
      openMyFilesDialog();
    }

    // Закрыть модаль Мои файлы при клике на фон
    document.getElementById('myfiles-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeMyFilesModal();
      }
    });

    // Закрыть модаль экспорта при клике на фон
    document.getElementById('export-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });
    </script>
</body>
</html>
