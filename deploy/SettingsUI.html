<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Google Sans', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    
    .header p {
      font-size: 14px;
      opacity: 0.9;
    }
    
    .content {
      padding: 30px;
    }
    
    .section {
      margin-bottom: 24px;
    }
    
    .section:last-child {
      margin-bottom: 0;
    }
    
    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #667eea;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .section-title .icon {
      font-size: 16px;
    }
    
    .input-group {
      position: relative;
      margin-bottom: 12px;
    }
    
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #333;
      margin-bottom: 6px;
    }
    
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s;
    }
    
    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    
    .help-text a {
      color: #667eea;
      text-decoration: none;
    }
    
    .help-text a:hover {
      text-decoration: underline;
    }
    
    .current-value {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
      font-family: 'Courier New', monospace;
    }
    
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, #e0e0e0, transparent);
      margin: 24px 0;
    }
    
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    
    button {
      flex: 1;
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
    
    .btn-primary:active {
      transform: translateY(0);
    }
    
    .btn-secondary {
      background: #f5f5f5;
      color: #666;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .status {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 16px;
      display: none;
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .status.success {
      background: #e6f4ea;
      color: #137333;
      border-left: 4px solid #34a853;
    }
    
    .status.error {
      background: #fce8e6;
      color: #c5221f;
      border-left: 4px solid #ea4335;
    }
    
    .status.info {
      background: #e8f0fe;
      color: #1967d2;
      border-left: 4px solid #1a73e8;
    }
    
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 36px;
      cursor: pointer;
      font-size: 18px;
      color: #999;
      user-select: none;
    }
    
    .toggle-password:hover {
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚙️ Настройки</h1>
      <p>Настройка Table AI: API ключ и лицензия</p>
    </div>
    
    <div class="content">
      <!-- Gemini API Key -->
      <div class="section">
        <div class="section-title">
          <span class="icon">🔑</span>
          <span>Gemini API Key</span>
        </div>
        
        <div class="input-group">
          <label for="apiKey">API ключ Gemini:</label>
          <input type="password" id="apiKey" placeholder="AIzaSy...">
          <span class="toggle-password" onclick="togglePassword('apiKey')">👁️</span>
          <div class="help-text">
            💡 <a href="https://aistudio.google.com/app/apikey" target="_blank">Получить ключ</a> 
            (откроется Google AI Studio)
          </div>
          <div class="current-value" id="currentApiKey"></div>
        </div>
      </div>
      
      <div class="divider"></div>
      
      <!-- License -->
      <div class="section">
        <div class="section-title">
          <span class="icon">🔐</span>
          <span>Лицензия</span>
        </div>
        
        <div class="input-group">
          <label for="email">Email:</label>
          <input type="text" id="email" placeholder="your@email.com">
          <div class="current-value" id="currentEmail"></div>
        </div>
        
        <div class="input-group">
          <label for="token">Токен:</label>
          <input type="password" id="token" placeholder="Токен из таблицы лицензий">
          <span class="toggle-password" onclick="togglePassword('token')">👁️</span>
          <div class="current-value" id="currentToken"></div>
        </div>
      </div>
      
      <!-- Actions -->
      <div class="actions">
        <button class="btn-primary" onclick="saveSettings()">💾 Сохранить всё</button>
        <button class="btn-secondary" onclick="google.script.host.close()">✕ Закрыть</button>
      </div>
      
      <div class="status" id="status"></div>
    </div>
  </div>

  <script>
    // Загрузка текущих значений
    google.script.run
      .withSuccessHandler(function(data) {
        if (data.apiKey) {
          document.getElementById('currentApiKey').textContent = '✅ Установлен: ' + data.apiKey.substring(0, 8) + '****';
        } else {
          document.getElementById('currentApiKey').textContent = '⚠️ Не установлен';
        }
        
        if (data.email) {
          document.getElementById('currentEmail').textContent = '📧 Текущий: ' + data.email;
          document.getElementById('email').value = data.email;
        } else {
          document.getElementById('currentEmail').textContent = '⚠️ Не установлен';
        }
        
        if (data.token) {
          document.getElementById('currentToken').textContent = '🔐 Установлен: ' + data.token.substring(0, 4) + '****';
        } else {
          document.getElementById('currentToken').textContent = '⚠️ Не установлен';
        }
      })
      .getSettingsData();
    
    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      field.type = field.type === 'password' ? 'text' : 'password';
    }
    
    function showStatus(message, type) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = 'status ' + type;
      status.style.display = 'block';
      
      if (type === 'success') {
        setTimeout(function() {
          status.style.display = 'none';
        }, 3000);
      }
    }
    
    function saveSettings() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const email = document.getElementById('email').value.trim();
      const token = document.getElementById('token').value.trim();
      
      if (!apiKey && !email && !token) {
        showStatus('❌ Заполните хотя бы одно поле', 'error');
        return;
      }
      
      showStatus('💾 Сохранение...', 'info');
      
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            showStatus('✅ ' + result.message, 'success');
            
            // Обновляем отображение текущих значений
            if (apiKey) {
              document.getElementById('currentApiKey').textContent = '✅ Установлен: ' + apiKey.substring(0, 8) + '****';
              document.getElementById('apiKey').value = '';
            }
            if (email) {
              document.getElementById('currentEmail').textContent = '📧 Текущий: ' + email;
            }
            if (token) {
              document.getElementById('currentToken').textContent = '🔐 Установлен: ' + token.substring(0, 4) + '****';
              document.getElementById('token').value = '';
            }
          } else {
            showStatus('❌ ' + result.message, 'error');
          }
        })
        .withFailureHandler(function(error) {
          showStatus('❌ Ошибка: ' + error.message, 'error');
        })
        .saveSettingsData({
          apiKey: apiKey || null,
          email: email || null,
          token: token || null
        });
    }
  </script>
</body>
</html>
