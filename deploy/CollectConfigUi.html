<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    
    .sidebar-root {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 300px;
      padding: 10px;
      font-family: 'Google Sans', Arial, sans-serif;
      background: #ffffff;
      overflow-x: hidden;
      box-sizing: border-box;
    }
    
    * {
      box-sizing: border-box;
    }
    
    h2 {
      margin: 0 0 4px 0;
      color: #202124;
      font-size: 18px;
      font-weight: 400;
      word-break: break-word;
    }
    
    .section {
      margin-bottom: 4px;
    }
    
    hr {
      border: none;
      border-top: 1px solid #dadce0;
      margin: 6px 0;
    }
    
    /* Cell Info */
    .cell-info {
      background: #e8f0fe;
      padding: 6px 8px;
      border-radius: 3px;
      margin-bottom: 4px;
      color: #1967d2;
      font-weight: 500;
      font-size: 11px;
      word-break: break-word;
    }
    
    /* Section Labels */
    .section-label {
      font-weight: 500;
      margin-bottom: 4px;
      color: #5f6368;
      font-size: 12px;
      display: block;
    }
    
    /* Input Groups */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 4px;
    }
    
    /* Checkbox Groups */
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 3px 0;
      font-size: 11px;
      color: #5f6368;
    }
    
    .checkbox-group input[type="checkbox"] {
      width: 14px;
      height: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }
    
    .checkbox-group label {
      cursor: pointer;
      user-select: none;
      word-break: break-word;
      line-height: 1.2;
    }
    
    /* Form Controls */
    select, input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #dadce0;
      border-radius: 3px;
      font-size: 12px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    
    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: #1a73e8;
    }
    
    input[type="text"]::placeholder {
      font-size: 11px;
      color: #9aa0a6;
    }
    
    /* Cell Preview */
    .cell-preview {
      margin-top: 3px;
      padding: 5px 6px;
      background: #f8f9fa;
      border-left: 3px solid #1a73e8;
      border-radius: 3px;
      font-size: 10px;
      color: #5f6368;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 40px;
      overflow-y: auto;
    }
    
    .cell-preview.empty {
      color: #9aa0a6;
      font-style: italic;
    }
    
    .cell-preview.error {
      border-left-color: #ea4335;
      color: #d93025;
    }
    
    /* User Data Blocks */
    .user-data-block {
      margin-bottom: 8px;
      padding: 6px 8px 8px 8px;
      background: #f8f9fa;
      border-radius: 3px;
      border: 1px solid #e8eaed;
      position: relative;
      padding-top: 26px;
    }
    
    .user-data-block .input-group {
      margin-bottom: 3px;
    }
    
    .delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #fff;
      border: 1px solid #dadce0;
      color: #5f6368;
      padding: 2px 6px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      line-height: 1;
    }
    
    .delete-btn:hover {
      background: #fce8e6;
      border-color: #d93025;
      color: #d93025;
    }
    
    /* Buttons */
    .btn {
      width: 100%;
      padding: 7px 10px;
      border: none;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #1a73e8;
      color: white;
    }
    
    .btn-primary:hover {
      background: #1765cc;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    
    .btn-secondary {
      background: #fff;
      color: #5f6368;
      border: 1px solid #dadce0;
    }
    
    .btn-secondary:hover {
      background: #f8f9fa;
    }
    
    .add-btn {
      background: #fff;
      border: 1px solid #1a73e8;
      color: #1a73e8;
      padding: 6px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
      width: 100%;
      margin-top: 3px;
    }
    
    .add-btn:hover {
      background: #e8f0fe;
    }
    
    /* Actions */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin: 4px 0;
    }
    
    /* Templates Section */
    .template-controls {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 5px;
    }
    
    .template-controls select {
      width: 100%;
    }
    
    /* Collapsible */
    details {
      border-top: 1px solid #dadce0;
      padding-top: 6px;
      margin-top: 5px;
    }
    
    summary {
      cursor: pointer;
      user-select: none;
      font-weight: 500;
      color: #5f6368;
      padding: 3px 0;
      font-size: 12px;
    }
    
    summary:hover {
      color: #1a73e8;
    }
    
    details input[type="text"] {
      width: 100%;
      margin-bottom: 6px;
    }
    
    .template-management-buttons {
      display: flex;
      gap: 5px;
    }
    
    .template-management-buttons button {
      flex: 1;
      padding: 6px 8px;
      font-size: 15px;
      cursor: pointer;
      border: 1px solid #dadce0;
      background: white;
      border-radius: 3px;
      transition: all 0.2s;
      text-align: center;
    }
    
    .template-management-buttons button:hover {
      background: #e8f0fe;
      border-color: #1a73e8;
    }
    
    /* Log Panel */
    .log-panel {
      border: 1px solid #dadce0;
      border-radius: 3px;
      background: #f8f9fa;
      padding: 6px;
    }
    
    .log-entries {
      max-height: 100px;
      overflow-y: auto;
      overflow-x: hidden;
    }
    
    .log-entry {
      font-size: 9px;
      font-family: 'Courier New', monospace;
      padding: 3px 4px;
      margin-bottom: 2px;
      border-radius: 2px;
      background: white;
      border-left: 2px solid #dadce0;
      word-break: break-word;
      overflow-wrap: break-word;
      line-height: 1.3;
    }
    
    .log-entry.info {
      border-left-color: #1a73e8;
      color: #1967d2;
    }
    
    .log-entry.success {
      border-left-color: #34a853;
      color: #137333;
    }
    
    .log-entry.warn {
      border-left-color: #fbbc04;
      color: #ea8600;
    }
    
    .log-entry.error {
      border-left-color: #ea4335;
      color: #c5221f;
    }
    
    /* Status */
    .status {
      padding: 6px 8px;
      border-radius: 3px;
      margin-top: 5px;
      display: none;
      font-size: 11px;
      word-break: break-word;
    }
    
    .status.info {
      display: block;
      background: #e8f0fe;
      color: #1967d2;
      border-left: 3px solid #1a73e8;
    }
    
    .status.success {
      display: block;
      background: #e6f4ea;
      color: #137333;
      border-left: 3px solid #34a853;
    }
    
    .status.error {
      display: block;
      background: #fce8e6;
      color: #c5221f;
      border-left: 3px solid #ea4335;
    }

    /* prompt_table Fields */
    .prompt-table-fields {
      background: rgba(76, 175, 80, 0.05);
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .prompt-table-fields input {
      background: rgba(76, 175, 80, 0.1);
      border: 1px solid rgba(76, 175, 80, 0.3);
    }

    .prompt-table-fields input:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
    }

    .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
    }

    .form-row .input-group {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="sidebar-root">
    <!-- 1. Заголовок -->
    <h2></h2>
    
    <!-- 2. Статус активной ячейки -->
    <div class="cell-info" id="cellInfo">Загрузка...</div>
    
    <!-- 3. System Prompt -->
    <div class="section system-prompt">
      <label class="section-label">📍 System Prompt</label>
      <div class="input-group">
        <select id="systemSheet" onchange="updateSystemPreview()">
          <option value="">Выберите лист...</option>
        </select>
        <input type="text" id="systemCell" placeholder="A1 или C" onblur="updateSystemPreview()" />
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="systemWholeColumn" onchange="handleColumnCheckbox('system')" />
        <label for="systemWholeColumn">📊 Весь столбец</label>
      </div>
      <div class="checkbox-group" style="margin-top: 12px;">
        <input type="checkbox" id="usePromptTable" onchange="togglePromptTableFields()" />
        <label for="usePromptTable" title="Чтение системного промпта из удалённой таблицы. Укажите только ячейку.">📡 prompt_table (удалённый сервер)</label>
      </div>
      <div id="promptTableFields" class="prompt-table-fields" style="display: none; margin-left: 24px; padding: 8px;">
        <input 
          type="text" 
          id="promptCellAddress" 
          placeholder="Ячейка"
          title="Адрес ячейки"
          style="width: 100%; padding: 6px 8px; border: 1px solid #dadce0; border-radius: 3px; font-size: 12px;"
        />
      </div>
      <div id="systemPreview" class="cell-preview" style="display:none;"></div>
    </div>
    
    <hr>
    
    <!-- 4. User Data -->
    <div class="section user-data-list">
      <label class="section-label">📦 User Data</label>
      <div id="userDataList"></div>
      <button class="add-btn" onclick="addUserDataRow()">+ Добавить источник</button>
    </div>
    
    <hr>
    
    <!-- 5. Основные действия -->
    <div class="actions">
      <button class="btn btn-primary" onclick="runConfig()">🚀 Запустить</button>
      <button class="btn btn-secondary" onclick="resetConfig()">🔄 Сбросить</button>
    </div>
    
    <div class="status" id="status"></div>
    
    <hr>
    
    <!-- 6. Шаблоны -->
    <div class="section templates-section">
      <label class="section-label">📋 Шаблоны</label>
      <div class="template-controls">
        <select id="templateSelect">
          <option value="">-- Выберите шаблон --</option>
        </select>
        <button class="btn btn-secondary" onclick="loadSelectedTemplate()">📂 Загрузить</button>
      </div>
      
      <details>
        <summary>▼ Управление шаблонами</summary>
        <input type="text" id="templateNameInput" placeholder="Имя шаблона..." />
        <div class="template-management-buttons">
          <button onclick="saveAsTemplate()" title="Сохранить как шаблон">💾</button>
          <button onclick="deleteSelectedTemplate()" title="Удалить шаблон">🗑️</button>
        </div>
      </details>
    </div>
    
    <hr>
    
    <!-- 7. Логирование -->
    <div class="section log-panel" id="logPanel" style="display:none;">
      <label class="section-label">📋 Логи</label>
      <div class="log-entries" id="logEntries"></div>
    </div>
  </div>


  <script>
    // ============================================================================
    // СИСТЕМА ЛОГИРОВАНИЯ
    // ============================================================================
    
    function addLogEntry(message, level) {
      level = level || 'info';
      const panel = document.getElementById('logPanel');
      const entries = document.getElementById('logEntries');
      
      if (!panel || !entries) return;
      
      panel.style.display = 'block';
      
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + level.toLowerCase();
      const timestamp = new Date().toLocaleTimeString('ru-RU');
      entry.textContent = '[' + timestamp + '] ' + message;
      
      entries.insertBefore(entry, entries.firstChild);
      
      while (entries.children.length > 20) {
        entries.removeChild(entries.lastChild);
      }
      
      panel.scrollTop = 0;
    }
    
    function clearLogs() {
      const entries = document.getElementById('logEntries');
      if (entries) entries.innerHTML = '';
    }

    // ⭐ НОВАЯ ФУНКЦИЯ: Переключение полей prompt_table
    function togglePromptTableFields() {
      const checkbox = document.getElementById('usePromptTable');
      const promptFields = document.getElementById('promptTableFields');
      const systemSheet = document.getElementById('systemSheet');
      const systemCell = document.getElementById('systemCell');
      const systemWholeColumn = document.getElementById('systemWholeColumn');
      const systemPromptSection = document.querySelector('.system-prompt');
      
      if (checkbox.checked) {
        // ✅ Активировать prompt_table
        promptFields.style.display = 'block';
        
        // ❌ Отключить локальные поля
        systemSheet.disabled = true;
        systemCell.disabled = true;
        systemWholeColumn.disabled = true;
        
        systemPromptSection.style.opacity = '0.4';
        systemPromptSection.style.pointerEvents = 'none';
        
        addLogEntry('📡 Режим prompt_table активирован', 'success');
        showStatus('📡 Будет прочитан промпт из удалённой таблицы', 'info');
        
      } else {
        // ✅ Вернуть локальные поля
        promptFields.style.display = 'none';
        
        systemSheet.disabled = false;
        systemCell.disabled = false;
        systemWholeColumn.disabled = false;
        
        systemPromptSection.style.opacity = '1';
        systemPromptSection.style.pointerEvents = 'auto';
        
        addLogEntry('📄 Возврат к локальным промптам', 'info');
        showStatus('', 'clear');
      }
    }

    let sheetName = '';
    let cellAddress = '';
    let sheets = [];
    
    google.script.run
      .withSuccessHandler(initialize)
      .withFailureHandler(showError)
      .getCollectConfigInitData();
    
    function initialize(data) {
      sheetName = data.sheetName;
      cellAddress = data.cellAddress;
      sheets = data.sheets;
      
      document.getElementById('cellInfo').textContent = 
        '📌 ' + sheetName + '!' + cellAddress;
      
      const systemSheet = document.getElementById('systemSheet');
      sheets.forEach(function(sheet) {
        const option = document.createElement('option');
        option.value = sheet;
        option.textContent = sheet;
        systemSheet.appendChild(option);
      });
      
      loadTemplatesList();
      loadExistingConfig();
    }
    
    function loadExistingConfig() {
      google.script.run
        .withSuccessHandler(function(config) {
          if (config) {
            if (config.prompt_table) {
              // ✅ Загрузить prompt_table конфигурацию
              document.getElementById('usePromptTable').checked = true;
              document.getElementById('promptCellAddress').value = config.prompt_table.cellAddress || '';
              togglePromptTableFields();
            } else if (config.systemPrompt) {
              document.getElementById('systemSheet').value = config.systemPrompt.sheet;
              document.getElementById('systemCell').value = config.systemPrompt.cell;
            }
            
            if (config.userData && config.userData.length > 0) {
              config.userData.forEach(function(data) {
                addUserDataRow(data.sheet, data.cell);
              });
            } else {
              addUserDataRow();
            }
          } else {
            addUserDataRow();
          }
        })
        .withFailureHandler(function() {
          addUserDataRow();
        })
        .loadCollectConfig(sheetName, cellAddress);
    }
    
    function addUserDataRow(sheet, cell) {
      const container = document.getElementById('userDataList');
      const block = document.createElement('div');
      block.className = 'user-data-block';
      
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = '🗑️';
      deleteBtn.title = 'Удалить источник';
      deleteBtn.onclick = function() {
        container.removeChild(block);
      };
      
      const inputGroup = document.createElement('div');
      inputGroup.className = 'input-group';
      
      const select = document.createElement('select');
      sheets.forEach(function(s) {
        const option = document.createElement('option');
        option.value = s;
        option.textContent = s;
        if (s === sheet) option.selected = true;
        select.appendChild(option);
      });
      
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'A1 или C';
      input.value = cell || '';
      
      inputGroup.appendChild(select);
      inputGroup.appendChild(input);
      
      const checkboxWrapper = document.createElement('div');
      checkboxWrapper.className = 'checkbox-group';
      
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.id = 'wholeColumn_' + Date.now();
      
      const checkboxLabel = document.createElement('label');
      checkboxLabel.setAttribute('for', checkbox.id);
      checkboxLabel.textContent = '📊 Весь столбец';
      
      checkboxWrapper.appendChild(checkbox);
      checkboxWrapper.appendChild(checkboxLabel);
      
      const preview = document.createElement('div');
      preview.className = 'cell-preview';
      preview.style.display = 'none';
      
      const updatePreview = function() {
        const s = select.value;
        const c = input.value.trim();
        
        if (s && c) {
          google.script.run
            .withSuccessHandler(function(text) {
              preview.textContent = text;
              preview.style.display = 'block';
              
              if (text.startsWith('(пусто)')) {
                preview.className = 'cell-preview empty';
              } else if (text.startsWith('❌')) {
                preview.className = 'cell-preview error';
              } else {
                preview.className = 'cell-preview';
              }
            })
            .getCellPreview(s, c);
        } else {
          preview.style.display = 'none';
        }
      };
      
      select.onchange = updatePreview;
      input.onblur = updatePreview;
      
      checkbox.onchange = function() {
        if (checkbox.checked) {
          const currentValue = input.value.trim();
          if (currentValue) {
            const columnLetter = extractColumnLetter(currentValue);
            if (columnLetter) {
              input.value = columnLetter + '1:' + columnLetter;
              updatePreview();
            }
          }
        }
      };
      
      block.appendChild(deleteBtn);
      block.appendChild(inputGroup);
      block.appendChild(checkboxWrapper);
      block.appendChild(preview);
      container.appendChild(block);
      
      if (sheet && cell) {
        updatePreview();
      }
    }
    
    function extractColumnLetter(cellRef) {
      const match = cellRef.match(/^([A-Z]+)\d*$/i);
      return match ? match[1].toUpperCase() : null;
    }
    
    function handleColumnCheckbox(type) {
      const checkbox = document.getElementById(type + 'WholeColumn');
      const input = document.getElementById(type + 'Cell');
      
      if (checkbox.checked) {
        const currentValue = input.value.trim();
        if (currentValue) {
          const columnLetter = extractColumnLetter(currentValue);
          if (columnLetter) {
            input.value = columnLetter + '1:' + columnLetter;
            updateSystemPreview();
          }
        }
      }
    }
    
    function updateSystemPreview() {
      const sheet = document.getElementById('systemSheet').value;
      const cell = document.getElementById('systemCell').value.trim();
      const preview = document.getElementById('systemPreview');
      
      if (!sheet || sheet.trim() === '' || !cell || cell === '') {
        preview.style.display = 'none';
        return;
      }
      
      addLogEntry('Preview: запрос для "' + sheet + '"!"' + cell + '"', 'info');
      
      if (sheet && cell) {
        google.script.run
          .withSuccessHandler(function(text) {
            preview.textContent = text;
            preview.style.display = 'block';
            
            if (text.startsWith('(пусто)')) {
              preview.className = 'cell-preview empty';
            } else if (text.startsWith('❌')) {
              preview.className = 'cell-preview error';
            } else {
              preview.className = 'cell-preview';
            }
          })
          .getCellPreview(sheet, cell);
      } else {
        preview.style.display = 'none';
      }
    }
    
    function collectConfig() {
      const usePromptTable = document.getElementById('usePromptTable').checked;
      
      let config = {
        systemPrompt: null,
        prompt_table: null,
        userData: []
      };
      
      if (usePromptTable) {
        // ✅ Формируем объект для серверной функции
        const cellAddress = document.getElementById('promptCellAddress').value.trim();
        
        if (!cellAddress) {
          showStatus('❌ Укажите ячейку', 'error');
          return null;
        }
        
        config.prompt_table = {
          cellAddress: cellAddress
          // ID таблицы и лист берутся из настроек (ScriptProperties)
        };
        
        addLogEntry(`📡 prompt_table: ${cellAddress}`, 'info');
        
      } else {
        // Обычная логика локальных промптов
        const systemSheet = document.getElementById('systemSheet').value;
        const systemCell = document.getElementById('systemCell').value;
        
        if (systemSheet && systemCell) {
          config.systemPrompt = {
            sheet: systemSheet,
            cell: systemCell
          };
        }
      }
      
      const dataBlocks = document.querySelectorAll('.user-data-block');
      dataBlocks.forEach(function(block) {
        const sheet = block.querySelector('select').value;
        const cell = block.querySelector('input').value;
        if (sheet && cell) {
          config.userData.push({ sheet: sheet, cell: cell });
        }
      });
      
      return config;
    }
    
    function runConfig() {
      clearLogs();
      addLogEntry('🚀 Начало выполнения конфигурации', 'info');
      
      const config = collectConfig();
      
      // Проверка null означает ошибку в collectConfig
      if (!config) {
        return;
      }
      
      addLogEntry('Конфигурация собрана: ' + JSON.stringify(config).substring(0, 100) + '...', 'info');
      
      if (!config.systemPrompt && !config.prompt_table && config.userData.length === 0) {
        showStatus('⚠️ Заполните хотя бы одно поле!', 'error');
        addLogEntry('❌ Валидация не прошла: нет данных', 'error');
        return;
      }
      
      addLogEntry('Целевая ячейка: ' + sheetName + '!' + cellAddress, 'info');
      
      if (config.prompt_table) {
        addLogEntry('📡 prompt_table: ' + config.prompt_table.cellAddress, 'info');
      } else if (config.systemPrompt) {
        addLogEntry('System Prompt: ' + config.systemPrompt.sheet + '!' + config.systemPrompt.cell, 'info');
      } else {
        addLogEntry('System Prompt: не указан', 'warn');
      }
      
      addLogEntry('User Data источников: ' + config.userData.length, 'info');
      config.userData.forEach(function(source, i) {
        addLogEntry('  Источник ' + (i + 1) + ': ' + source.sheet + '!' + source.cell, 'info');
      });
      
      console.log('Запуск конфигурации с помощью новой функции:', config);
      showStatus('🚀 Сохранение и выполнение...', 'info');
      addLogEntry('Отправка запроса на сервер...', 'info');
      
      google.script.run
        .withSuccessHandler(function(result) {
          console.log('Результат выполнения:', result);
          addLogEntry('✅ Ответ от сервера получен', 'success');
          
          if (result.success) {
            showStatus('✅ Готово! Результат записан в ' + cellAddress, 'success');
            addLogEntry('✅ УСПЕХ! Результат записан в ' + cellAddress, 'success');
            addLogEntry('Результат: ' + (result.result ? result.result.substring(0, 100) + '...' : 'пусто'), 'info');
            setTimeout(function() {
              google.script.host.close();
            }, 2000);
          } else {
            showStatus('❌ Ошибка выполнения: ' + (result.error || 'Неизвестная ошибка'), 'error');
            addLogEntry('❌ ОШИБКА ВЫПОЛНЕНИЯ: ' + (result.error || 'Неизвестная ошибка'), 'error');
          }
        })
        .withFailureHandler(function(error) {
          console.error('Критическая ошибка:', error);
          showStatus('❌ Критическая ошибка: ' + error.message, 'error');
          addLogEntry('❌ КРИТИЧЕСКАЯ ОШИБКА: ' + error.message, 'error');
        })
        .saveAndExecuteCollectConfig(sheetName, cellAddress, config);
    }
    
    function resetConfig() {
      if (confirm('Удалить сохранённую конфигурацию?')) {
        google.script.run
          .withSuccessHandler(function() {
            showStatus('✅ Конфигурация сброшена!', 'success');
            setTimeout(function() {
              google.script.host.close();
            }, 1000);
          })
          .withFailureHandler(function(error) {
            showStatus('❌ Ошибка: ' + error, 'error');
          })
          .deleteCollectConfig(sheetName, cellAddress);
      }
    }
    
    // ============================================================================
    // TEMPLATE FUNCTIONS
    // ============================================================================
    
    function loadTemplatesList() {
      google.script.run
        .withSuccessHandler(function(templates) {
          const select = document.getElementById('templateSelect');
          select.options.length = 1;
          
          for (const templateName in templates) {
            const option = document.createElement('option');
            option.value = templateName;
            option.textContent = templateName;
            select.appendChild(option);
          }
        })
        .withFailureHandler(showError)
        .serverGetAllTemplates();
    }
    
    function loadSelectedTemplate() {
      const select = document.getElementById('templateSelect');
      const templateName = select.value;
      
      if (!templateName) {
        showError('Выберите шаблон из списка');
        return;
      }
      
      showStatus('Загрузка шаблона "' + templateName + '"...', 'info');
      
      google.script.run
        .withSuccessHandler(function(config) {
          if (!config) {
            showError('Шаблон "' + templateName + '" не найден');
            return;
          }
          
          // ✅ Загрузить prompt_table если присутствует
          if (config.prompt_table) {
            document.getElementById('usePromptTable').checked = true;
            document.getElementById('promptCellAddress').value = config.prompt_table.cellAddress || '';
            togglePromptTableFields();
          } else {
            // Использовать systemPrompt если prompt_table не определён
            document.getElementById('usePromptTable').checked = false;
            document.getElementById('systemSheet').value = config.systemPrompt ? config.systemPrompt.sheet : '';
            document.getElementById('systemCell').value = config.systemPrompt ? config.systemPrompt.cell : '';
            togglePromptTableFields();
          }
          
          const userDataList = document.getElementById('userDataList');
          userDataList.innerHTML = '';
          
          if (config.userData && config.userData.length > 0) {
            config.userData.forEach(function(ud) {
              addUserDataRow(ud.sheet, ud.cell);
            });
          }
          
          document.getElementById('templateNameInput').value = templateName;
          
          showStatus('Шаблон "' + templateName + '" загружен', 'success');
        })
        .withFailureHandler(showError)
        .serverGetTemplate(templateName);
    }
    
    function saveAsTemplate() {
      const templateName = document.getElementById('templateNameInput').value.trim();
      
      if (!templateName) {
        showError('Введите имя шаблона');
        return;
      }
      
      const config = collectConfig();
      
      if (!config || (!config.systemPrompt && !config.prompt_table)) {
        showError('Укажите System Prompt или prompt_table');
        return;
      }
      
      if (config.systemPrompt && (!config.systemPrompt.sheet || !config.systemPrompt.cell)) {
        showError('Укажите System Prompt (лист и ячейку)');
        return;
      }
      
      if (config.prompt_table && (!config.prompt_table.cellAddress)) {
        showError('Укажите ячейку для prompt_table');
        return;
      }
      
      showStatus('Сохранение шаблона "' + templateName + '"...', 'info');
      
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success) {
            showStatus(response.message + (response.size ? ' (' + response.size + ' байт)' : ''), 'success');
            loadTemplatesList();
          } else {
            showError(response.message);
          }
        })
        .withFailureHandler(showError)
        .serverSaveTemplate(templateName, config);
    }
    
    function deleteSelectedTemplate() {
      const select = document.getElementById('templateSelect');
      const templateName = select.value;
      
      if (!templateName) {
        showError('Выберите шаблон для удаления');
        return;
      }
      
      if (!confirm('Вы уверены, что хотите удалить шаблон "' + templateName + '"?')) {
        return;
      }
      
      showStatus('Удаление шаблона "' + templateName + '"...', 'info');
      
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success) {
            showStatus(response.message, 'success');
            document.getElementById('templateNameInput').value = '';
            loadTemplatesList();
          } else {
            showError(response.message);
          }
        })
        .withFailureHandler(showError)
        .serverDeleteTemplate(templateName);
    }
    
    // ============================================================================
    // STATUS FUNCTIONS
    // ============================================================================
    
    function showStatus(message, type) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = 'status ' + type;
      status.style.display = 'block';
    }
    
    function showError(error) {
      showStatus('❌ Ошибка: ' + error, 'error');
    }
  </script>
</body>
</html>
